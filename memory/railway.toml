# ha-memory service config-as-code (RW-1).
# Railway does NOT resolve this file relative to Root Directory: set the service's
# "Config file path" to /memory/railway.toml with Root Directory /memory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/memory/**"]

[deploy]
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
